<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard executivo do Mercado Tech Brasil</title>
  <desc id="desc">Resumo visual da série publicada de janeiro a julho de 2026, com indicadores acumulados, evolução mensal e comparação territorial.</desc>
  <rect width="1200" height="760" rx="28" fill="#f7f7f9"/>
  <rect x="24" y="24" width="1152" height="712" rx="24" fill="#ffffff" stroke="#dedee4"/>

