    <text x="82" y="264" font-size="34" font-weight="800" fill="#ffffff">134.209</text>
    <text x="82" y="284" font-size="11" fill="#a9a9b1">acumulado jan-jul</text>

    <rect x="330" y="190" width="250" height="108" rx="16" fill="#f5f5f7" stroke="#e0e0e5"/>
