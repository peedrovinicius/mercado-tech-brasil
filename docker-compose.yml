services:
  db:
    image: postgres:16-alpine
    container_name: mercado-tech-brasil-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mercado_tech}
      POSTGRES_USER: ${POSTGRES_USER:-mercado_tech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mercado_tech_dev}
    ports:
      - "5432:5432"
    volumes:
      - mercado_tech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mercado_tech} -d ${POSTGRES_DB:-mercado_tech}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: mercado-tech-brasil-api
    environment:
      APP_ENV: docker
      DATA_BACKEND: ${DATA_BACKEND:-postgres}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mercado_tech}:${POSTGRES_PASSWORD:-mercado_tech_dev}@db:5432/${POSTGRES_DB:-mercado_tech}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    container_name: mercado-tech-brasil-web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mercado_tech_pgdata:
