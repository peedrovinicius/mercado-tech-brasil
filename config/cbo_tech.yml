rationale:
  - "2122 entra na v2 porque o MTE a classifica como Engenheiros em computação dentro do grupo 212 Profissionais da Informática."
  - "2123 e 2124 permanecem como famílias profissionais diretamente ligadas à informática."
  - "3171 e 3172 permanecem como famílias técnicas do grupo 317 Técnicos em Informática."
  - "O recorte é ocupacional, não setorial: profissionais podem trabalhar em qualquer atividade econômica."
notes:
  - "O recorte é explícito e versionado."
  - "Nenhuma família entra ou sai silenciosamente."
  - "Mudanças exigem fonte oficial, justificativa e teste."
