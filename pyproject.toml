[project]
name = "mercado-tech-brasil"
version = "0.40.0"
description = "Plataforma de dados do mercado formal de trabalho em tecnologia no Brasil, com pipeline auditável, API e aplicação web."
keywords = ["data-engineering", "data-analysis", "brazil", "caged", "rais", "labor-market"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "polars>=1.30,<2",
  "duckdb>=1.3,<2",
  "pyarrow>=20,<22",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "pandera>=0.24,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "py7zr>=0.22,<2"
]

[project.urls]
Homepage = "https://mercado-tech-brasil.onrender.com"
Repository = "https://github.com/peedrovinicius/mercado-tech-brasil"
Documentation = "https://github.com/peedrovinicius/mercado-tech-brasil/tree/main/docs"
OpenAPI = "https://mercado-tech-brasil.onrender.com/docs"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
  "httpx>=0.28,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
