name: Backfill 2026 history

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backfill-2026.yml"
  workflow_dispatch:

concurrency:
  group: backfill-2026-history
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Sync official references
        run: |
          python -m src.cli sync-municipalities
          python -m src.cli sync-ipca 202601 202602 202603 202604 202605 202606 202607 --base 202607

      - name: Process January to July
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.cli import (
              command_extract,
              command_gold,
              command_transform,
              command_transform_adjustment,
          )
          from src.core.settings import settings
          from src.ingestion.https_caged import (
              download_month_resilient,
              write_download_manifest,
          )
          from src.validation.publication_gate import (
              evaluate_publication_gate,
              write_publication_gate,
          )

          months = [
              "202601",
              "202602",
              "202603",
              "202604",
              "202605",
              "202606",
              "202607",
          ]

          for yearmonth in months:
              print(f"processing {yearmonth}")
              archive_dir = settings.bronze_path / yearmonth / "archives"
              artifacts = []

              for kind in ("MOV", "FOR", "EXC"):
                  try:
                      found = download_month_resilient(
                          yearmonth,
                          archive_dir,
                          file_types=(kind,),
                      )
                      artifacts.extend(found)
                      for item in found:
                          print(
                              f"downloaded competence={yearmonth} "
                              f"kind={item.kind} transport={item.transport}"
                          )
                  except Exception as exc:
                      if kind == "MOV":
                          raise
                      print(
                          f"optional adjustment unavailable "
                          f"competence={yearmonth} kind={kind}: {exc}"
                      )

              write_download_manifest(
                  artifacts,
                  archive_dir / "download-manifest.json",
              )

              command_extract(yearmonth)
              command_transform(yearmonth)

              extracted = settings.bronze_path / yearmonth / "extracted"
              for kind in ("FOR", "EXC"):
                  marker = f"CAGED{kind}"
                  available = any(
                      path.is_file()
                      and marker in path.name.upper()
                      and path.suffix.lower() == ".txt"
                      for path in extracted.rglob("*")
                  )
                  if available:
                      command_transform_adjustment(yearmonth, kind)

              command_gold(yearmonth)

              for path in extracted.rglob("*.txt"):
                  path.unlink()
              for path in archive_dir.glob("*.7z"):
                  path.unlink()

          for yearmonth in months:
              base = settings.silver_path / f"caged_tech_{yearmonth}.parquet"
              command_gold(yearmonth)

          report = {
              "period": {
                  "start": months[0],
                  "end": months[-1],
                  "competencies": months,
              },
              "months": {},
          }
          failures = []

          for yearmonth in months:
              gate = evaluate_publication_gate(
                  yearmonth=yearmonth,
                  bronze_dir=settings.bronze_path,
                  gold_dir=settings.gold_path,
                  reference_path=settings.reference_totals_path,
                  approvals_path=settings.publication_approvals_path,
              )
              write_publication_gate(
                  gate,
                  settings.gold_path
                  / f"publication-gate-{yearmonth}.json",
              )
              overview = json.loads(
                  (
                      settings.gold_path
                      / f"overview-{yearmonth}.json"
                  ).read_text(encoding="utf-8")
              )
              quality = json.loads(
                  (
                      settings.gold_path
                      / f"quality-{yearmonth}.json"
                  ).read_text(encoding="utf-8")
              )

              report["months"][yearmonth] = {
                  "source_sha256": gate.source_sha256,
                  "automatic_checks_passed": gate.automatic_checks_passed,
                  "manual_approval_valid": gate.manual_approval_valid,
                  "publishable": gate.publishable,
                  "admissions": overview["admissions"],
                  "dismissals": overview["dismissals"],
                  "balance": overview["balance"],
                  "records_tech": overview["records_tech"],
                  "valid_rate": quality["valid_rate"],
                  "rows_rejected": quality["rows_rejected"],
                  "adjustments": overview.get("adjustments", []),
                  "checks": [
                      {
                          "id": item.id,
                          "passed": item.passed,
                          "blocking": item.blocking,
                      }
                      for item in gate.checks
                  ],
              }

              if not gate.automatic_checks_passed:
                  failures.append(yearmonth)

          destination = settings.gold_path / "backfill-2026-report.json"
          destination.write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))

          if failures:
              raise SystemExit(
                  "Automatic publication checks failed: "
                  + ", ".join(failures)
              )
          PY

      - name: Upload derived audit
        uses: actions/upload-artifact@v4
        with:
          name: caged-2026-history-audit
          retention-days: 3
          if-no-files-found: error
          path: |
            data/gold/*.json
            data/gold/*.parquet
            data/bronze/2026*/archives/download-manifest.json
            data/bronze/2026*/extracted/*.manifest.json
            data/reference/ipca.json
            data/reference/municipalities.json
