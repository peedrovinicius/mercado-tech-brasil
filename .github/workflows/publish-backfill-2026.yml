name: Publish 2026 history

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-backfill-2026.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: "36230798117"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download audited history
        uses: actions/download-artifact@v4
        with:
          name: caged-2026-history-audit
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Rebuild publication gates
        run: |
          for competence in 202601 202602 202603 202604 202605 202606 202607; do
            python -m src.cli validate-release "$competence" --strict
          done

      - name: Verify historical release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          months = [
              "202601",
              "202602",
              "202603",
              "202604",
              "202605",
              "202606",
              "202607",
          ]

          for competence in months:
              gate = json.loads(
                  Path(
                      f"data/gold/publication-gate-{competence}.json"
                  ).read_text(encoding="utf-8")
              )
              if gate.get("publishable") is not True:
                  raise SystemExit(
                      f"Competência não publicável: {competence}"
                  )

          trend = json.loads(
              Path("data/gold/trend.json").read_text(encoding="utf-8")
          )
          available = {
              str(item.get("competence"))
              for item in trend.get("items", [])
          }
          missing = [month for month in months if month not in available]
          if missing:
              raise SystemExit(
                  "Competências ausentes da série: " + ", ".join(missing)
              )

          print("historical release verified:", ", ".join(months))
          PY

      - name: Persist derived history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f             data/gold/*.json             data/gold/market-*.parquet             data/bronze/2026*/archives/download-manifest.json             data/bronze/2026*/extracted/*.manifest.json

          git add data/reference/ipca.json

          if git diff --cached --quiet; then
            echo "Histórico já está versionado."
            exit 0
          fi

          git commit -m "data: publish validated 2026 history [skip ci]"
          git push
