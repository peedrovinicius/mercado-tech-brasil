name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Ensure validated commit is current main
        id: current
        run: |
          git fetch origin main --quiet
          VALIDATED_SHA="${{ github.event.workflow_run.head_sha }}"
          MAIN_SHA="$(git rev-parse origin/main)"

          if [[ "$VALIDATED_SHA" != "$MAIN_SHA" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Validated commit is no longer current main; skipping release."
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        if: steps.current.outputs.eligible == 'true'
        id: version
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          payload = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(payload["project"]["version"])
          PY
          )"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION"
            exit 2
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        if: steps.current.outputs.eligible == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate curated release notes
        if: steps.current.outputs.eligible == 'true' && steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES="docs/releases/v$VERSION.md"
          test -s "$NOTES"
          grep -F "v$VERSION" "$NOTES"

      - name: Publish GitHub release
        if: steps.current.outputs.eligible == 'true' && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$TAG"             --target "$TARGET_SHA"             --title "$TAG"             --notes-file "docs/releases/v$VERSION.md"             --latest
