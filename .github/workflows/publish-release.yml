name: Publish validated release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  COMPETENCE: "202607"
  SOURCE_RUN_ID: "36229529205"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated audit artifact
        uses: actions/download-artifact@v4
        with:
          name: caged-202607-audit
          path: data
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Rebuild publication gate
        run: python -m src.cli validate-release "${COMPETENCE}" --strict

      - name: Verify publishable release
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          competence = "202607"
          gate = json.loads(
              Path(
                  f"data/gold/publication-gate-{competence}.json"
              ).read_text(encoding="utf-8")
          )
          if gate.get("publishable") is not True:
              raise SystemExit("Release não está publicável.")
          print(
              "release publishable:",
              competence,
              gate.get("source_sha256"),
          )
          PY

      - name: Persist derived release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f             data/gold/audit-national-mov-202607.json             data/gold/by-municipality-202607.json             data/gold/by-occupation-202607.json             data/gold/by-uf-202607.json             data/gold/market-202607.parquet             data/gold/overview-202607.json             data/gold/publication-gate-202607.json             data/gold/quality-202607.json             data/gold/quality-for-202607.json             data/gold/quality-exc-202607.json             data/gold/trend.json             data/bronze/202607/archives/download-manifest.json             data/bronze/202607/extracted/CAGEDMOV202607.txt.manifest.json             data/bronze/202607/extracted/CAGEDFOR202607.txt.manifest.json             data/bronze/202607/extracted/CAGEDEXC202607.txt.manifest.json

          git add data/reference/ipca.json

          if git diff --cached --quiet; then
            echo "Snapshot já está versionado."
            exit 0
          fi

          git commit -m "data: publish validated July 2026 snapshot [skip ci]"
          git push
