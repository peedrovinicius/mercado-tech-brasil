name: RAIS v0.35 validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/rais-v035-test.run"

permissions:
  contents: read

concurrency:
  group: rais-v035-validation
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run RAIS qualification tests
        run: |
          pytest -q             tests/unit/test_rais_semantics.py             tests/unit/test_rais_profile.py             tests/unit/test_rais_value_semantics.py             tests/unit/test_rais_silver.py             tests/unit/test_rais_parts.py             tests/unit/test_rais_reconciliation.py
