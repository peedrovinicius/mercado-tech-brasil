name: Prepare next CAGED competence

on:
  push:
    branches:
      - main
    paths:
      - "config/reference_totals.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: prepare-next-caged
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Resolve next eligible competence
        id: next
        run: |
          python -m src.cli next-competence --json > /tmp/next-competence.json
          cat /tmp/next-competence.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/next-competence.json").read_text(encoding="utf-8")
          )
          print(f"ready={'true' if payload['ready'] else 'false'}")
          print(f"reason={payload['reason']}")
          print(f"candidate={payload['candidate'] or ''}")
          print(f"next_expected={payload['next_expected'] or ''}")
          PY

      - name: Resolve IPCA base
        if: steps.next.outputs.ready == 'true'
        id: ipca
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          payload = json.loads(
              Path("data/reference/ipca.json").read_text(encoding="utf-8")
          )
          base = str(payload.get("base_competence") or "")
          if len(base) != 6 or not base.isdigit():
              raise SystemExit("Base IPCA versionada é inválida.")
          print(f"base={base}")
          PY

      - name: Dispatch audited preparation
        if: steps.next.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.next.outputs.candidate }}
          IPCA_BASE: ${{ steps.ipca.outputs.base }}
        run: |
          gh workflow run audit-data.yml \
            --ref main \
            -f competence="$CANDIDATE" \
            -f ipca_base="$IPCA_BASE" \
            -f allow_reaudit=false

      - name: Nothing to prepare
        if: steps.next.outputs.ready != 'true'
        run: |
          echo "Nenhuma nova competência elegível."
          echo "Motivo: ${{ steps.next.outputs.reason }}"
          echo "Próxima esperada: ${{ steps.next.outputs.next_expected }}"
