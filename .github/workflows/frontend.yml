name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "config/rais_publication_approvals.json"
      - "data/gold/rais-publication-gate-*.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Verify React and React DOM runtime pairing
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import React from "react";
          import ReactDOM from "react-dom";
          import { renderToStaticMarkup } from "react-dom/server";

          if (React.version !== "19.3.1" || ReactDOM.version !== React.version) {
            throw new Error(`React/React DOM versions mismatch: ${React.version} / ${ReactDOM.version}`);
          }

          const markup = renderToStaticMarkup(React.createElement("main", null, "OK"));
          if (markup !== "<main>OK</main>") {
            throw new Error("React DOM server-side rendering smoke test failed");
          }
          NODE

      - name: Verify React Query cache and provider integration
        working-directory: frontend
        run: |
          node --input-type=module <<'NODE'
          import React from "react";
          import { renderToStaticMarkup } from "react-dom/server";
          import { QueryClient, QueryClientProvider, useQuery } from "@tanstack/react-query";

          const client = new QueryClient({
            defaultOptions: { queries: { retry: false, staleTime: 60_000 } },
          });
          const key = ["synthetic", "frontend-smoke"];
          const record = await client.fetchQuery({
            queryKey: key,
            queryFn: async () => ({ label: "OK", count: 2 }),
          });
          if (record.count !== 2 || client.getQueryData(key)?.label !== "OK") {
            throw new Error("React Query fetch/cache smoke test failed");
          }

          function Probe() {
            const { data, isSuccess } = useQuery({
              queryKey: key,
              queryFn: async () => { throw new Error("Unexpected fetch in SSR"); },
            });
            return React.createElement("main", null, isSuccess ? data.label : "FAILED");
          }

          const markup = renderToStaticMarkup(
            React.createElement(QueryClientProvider, { client }, React.createElement(Probe)),
          );
          client.clear();
          if (markup !== "<main>OK</main>") {
            throw new Error("React Query provider SSR smoke failed: " + markup);
          }
          NODE

      - name: Build
        working-directory: frontend
        run: npm run build
