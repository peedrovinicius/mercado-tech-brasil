name: Deployment policy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "frontend/**"
      - "data/gold/**"
      - "pyproject.toml"
      - "render.yaml"
      - ".github/workflows/deployment-policy.yml"
  pull_request:
    paths:
      - "src/**"
      - "frontend/**"
      - "data/gold/**"
      - "pyproject.toml"
      - "render.yaml"
      - ".github/workflows/deployment-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Resolve changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > changed-files.txt
          else
            git diff --name-only HEAD^ HEAD > changed-files.txt
          fi

          cat changed-files.txt

      - name: Validate publication gates
        run: |
          python -m src.validation.deployment_policy \
            --changed-files changed-files.txt
