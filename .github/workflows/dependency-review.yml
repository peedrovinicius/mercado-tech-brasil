name: Dependency audit

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "frontend/package.json"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Build direct dependency list
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          payload = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          dependencies = payload["project"]["dependencies"]
          Path("python-requirements-audit.txt").write_text(
              "\n".join(dependencies) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit             -r python-requirements-audit.txt             --progress-spinner off

  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate
