name: Audit data competence

on:
  workflow_dispatch:
    inputs:
      competence:
        description: "Competência no formato AAAAMM"
        required: true
        type: string
      ipca_base:
        description: "Competência base do IPCA"
        required: true
        default: "202607"
        type: string
      allow_reaudit:
        description: "Permitir reauditoria explícita de competência já publicada"
        required: true
        default: false
        type: boolean

  pull_request:
    paths:
      - "config/reference_totals.json"
      - "config/monthly_coverage_policy.json"
      - "scripts/rehydrate_caged_history.py"
      - "tests/unit/test_rehydrate_caged_history.py"
      - ".github/workflows/audit-data.yml"

permissions:
  contents: read

concurrency:
  group: audit-data-${{ github.event_name }}-${{ inputs.competence || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COMPETENCE: ${{ inputs.competence }}
      IPCA_BASE: ${{ inputs.ipca_base || '202607' }}
      ALLOW_REAUDIT: ${{ inputs.allow_reaudit || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve target competence
        id: target
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            COMPETENCE="$(python3 -c 'import json; from pathlib import Path; print(json.loads(Path("config/monthly_coverage_policy.json").read_text(encoding="utf-8"))["max_competence"])')"
            echo "COMPETENCE=$COMPETENCE" >> "$GITHUB_ENV"
          fi
          if [[ ! "$COMPETENCE" =~ ^[0-9]{6}$ ]]; then
            echo "Competência inválida: $COMPETENCE"
            exit 1
          fi
          echo "competence=$COMPETENCE" >> "$GITHUB_OUTPUT"


      - name: Validate inputs
        run: |
          if [[ ! "$COMPETENCE" =~ ^[0-9]{6}$ ]]; then
            echo "Competência inválida: $COMPETENCE"
            exit 1
          fi
          if [[ ! "$IPCA_BASE" =~ ^[0-9]{6}$ ]]; then
            echo "Base IPCA inválida: $IPCA_BASE"
            exit 1
          fi

      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate incremental eligibility
        run: |
          if [[ "$ALLOW_REAUDIT" == "true" ]]; then
            python -m src.cli validate-incremental-competence "$COMPETENCE" --allow-published
          else
            python -m src.cli validate-incremental-competence "$COMPETENCE"
          fi

      - name: Snapshot published history
        run: |
          python -m src.cli snapshot-published-history \
            --destination /tmp/published-history.json

      - name: Sync official references
        run: |
          retry_official() {
            local attempt=1
            while [[ "$attempt" -le 3 ]]; do
              if "$@"; then
                return 0
              fi
              if [[ "$attempt" -eq 3 ]]; then
                echo "Fonte oficial indisponível após 3 tentativas: $*"
                return 1
              fi
              echo "Falha temporária na fonte oficial; nova tentativa $((attempt + 1))/3."
              sleep "$((5 * attempt))"
              attempt=$((attempt + 1))
            done
          }

          retry_official python -m src.cli sync-municipalities

          # IBGE SIDRA não está respondendo no runner. O repositório inclui
          # snapshots oficiais versionados, usados somente se suas fontes,
          # competências e cobertura passarem nas verificações estritas.
          python - <<'PY'
          import os

          from src.core.settings import settings
          from src.reference.cache_validation import verify_audit_references

          verify_audit_references(
              population_path=settings.population_cache_path,
              ipca_path=settings.ipca_cache_path,
              competence=os.environ["COMPETENCE"],
              base_competence=os.environ["IPCA_BASE"],
          )
          PY

      - name: Validate IBGE municipality coverage
        run: |
          python - <<'PY'
          from src.core.settings import settings
          from src.reference.municipalities import load_municipalities
          from src.reference.population import load_population_cache

          municipalities = load_municipalities(
              settings.municipalities_cache_path
          )
          population = load_population_cache(settings.population_cache_path)
          if population.get("source") != "IBGE SIDRA":
              raise SystemExit("Fonte populacional não é IBGE SIDRA.")
          expected = {
              code[:6] for code in population["municipalities"]
          }
          actual = set(municipalities)
          if len(expected) != len(population["municipalities"]):
              raise SystemExit(
                  "Prefixos IBGE ambíguos na referência populacional."
              )
          missing = expected - actual
          unexpected = actual - expected
          print(
              f"IBGE: municipios={len(actual)} "
              f"populacao={len(expected)} "
              f"faltando={len(missing)} extras={len(unexpected)}"
          )
          if missing or unexpected:
              raise SystemExit(
                  "Referência municipal divergente da população IBGE. "
                  "A auditoria não pode prosseguir com cobertura parcial."
              )
          PY

      - name: Download official competence
        run: |
          python - <<'PY'
          import os

          from src.core.settings import settings
          from src.ingestion.https_caged import (
              download_month_resilient,
              write_download_manifest,
          )

          competence = os.environ["COMPETENCE"]
          archive_dir = settings.bronze_path / competence / "archives"
          artifacts = []

          for kind in ("MOV", "FOR", "EXC"):
              try:
                  found = download_month_resilient(
                      competence,
                      archive_dir,
                      file_types=(kind,),
                      # Competências novas não devem usar espelho externo.
                      official_only=competence >= "202609",
                  )
                  artifacts.extend(found)
                  for item in found:
                      print(
                          f"downloaded competence={competence} "
                          f"kind={item.kind} transport={item.transport}"
                      )
              except Exception as exc:
                  if kind == "MOV" or competence >= "202609":
                      raise
                  print(
                      f"optional adjustment unavailable "
                      f"competence={competence} kind={kind}: {exc}"
                  )

          write_download_manifest(
              artifacts,
              archive_dir / "download-manifest.json",
          )
          PY

      - name: Rehydrate historical Silver from official MTE sources
        run: |
          if [[ "$COMPETENCE" < "202609" ]]; then
            echo "Reconstituição histórica exigida a partir de 202609."
            exit 0
          fi
          python -m scripts.rehydrate_caged_history "$COMPETENCE" \
            --baseline /tmp/published-history.json

      - name: Process and audit
        run: |
          python - <<'PY'
          import json
          import os

          from src.cli import (
              command_extract,
              command_gold,
              command_transform,
              command_transform_adjustment,
          )
          from src.core.settings import settings
          from src.validation.publication_gate import (
              evaluate_publication_gate,
              write_publication_gate,
          )

          competence = os.environ["COMPETENCE"]

          command_extract(competence)
          command_transform(competence)

          extracted = settings.bronze_path / competence / "extracted"
          for kind in ("FOR", "EXC"):
              marker = f"CAGED{kind}"
              available = any(
                  path.is_file()
                  and marker in path.name.upper()
                  and path.suffix.lower() == ".txt"
                  for path in extracted.rglob("*")
              )
              if available:
                  command_transform_adjustment(competence, kind)

          command_gold(competence)

          gate = evaluate_publication_gate(
              yearmonth=competence,
              bronze_dir=settings.bronze_path,
              gold_dir=settings.gold_path,
              reference_path=settings.reference_totals_path,
              approvals_path=settings.publication_approvals_path,
          )
          write_publication_gate(
              gate,
              settings.gold_path / f"publication-gate-{competence}.json",
          )

          report = {
              "competence": competence,
              "source_sha256": gate.source_sha256,
              "automatic_checks_passed": gate.automatic_checks_passed,
              "manual_approval_valid": gate.manual_approval_valid,
              "publishable": gate.publishable,
              "checks": [
                  {
                      "id": item.id,
                      "passed": item.passed,
                      "blocking": item.blocking,
                      "message": item.message,
                  }
                  for item in gate.checks
              ],
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))

          for path in extracted.rglob("*.txt"):
              path.unlink()
          for path in (
              settings.bronze_path / competence / "archives"
          ).glob("*.7z"):
              path.unlink()
          PY

      - name: Enrich candidate population provenance
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import date
          from pathlib import Path

          from src.core.settings import settings
          from src.validation.population_enrichment import (
              enrich_published_municipality_population,
          )
          from src.validation.publication_gate import (
              evaluate_publication_gate,
              write_publication_gate,
          )

          competence = os.environ["COMPETENCE"]
          targets = json.loads(
              Path("config/population_release_targets.json").read_text(
                  encoding="utf-8"
              )
          )
          eligible = []
          for effective_from, target in targets.items():
              if target.get("enabled") is not True:
                  continue
              if (
                  len(effective_from) != 6
                  or not effective_from.isdigit()
                  or effective_from > competence
              ):
                  continue

              population_year = int(target["population_year"])
              if target.get("reference_date") != f"{population_year}-07-01":
                  raise SystemExit(
                      f"Referência populacional inválida: {effective_from}"
                  )

              published_at = date.fromisoformat(target["published_at"])
              if published_at > date.today():
                  continue

              source_url = str(target.get("source_url") or "")
              if not source_url.startswith("https://www.ibge.gov.br/"):
                  raise SystemExit(
                      f"Fonte populacional não oficial: {effective_from}"
                  )
              eligible.append((effective_from, target))

          if not eligible:
              raise SystemExit(
                  f"Sem referência populacional elegível para {competence}."
              )

          effective_from, target = max(
              eligible,
              key=lambda item: item[0],
          )
          report = enrich_published_municipality_population(
              yearmonth=competence,
              population_year=int(target["population_year"]),
              gold_dir=settings.gold_path,
              population_cache_path=settings.population_cache_path,
              source_url=target["source_url"],
              published_at=target["published_at"],
              allow_unpublished_candidate=True,
          )

          gate = evaluate_publication_gate(
              yearmonth=competence,
              bronze_dir=settings.bronze_path,
              gold_dir=settings.gold_path,
              reference_path=settings.reference_totals_path,
              approvals_path=settings.publication_approvals_path,
          )
          write_publication_gate(
              gate,
              settings.gold_path / f"publication-gate-{competence}.json",
          )

          failures = [
              item.id
              for item in gate.checks
              if item.blocking and not item.passed
          ]
          print(
              "population candidate enrichment: "
              f"competence={competence} "
              f"reference_effective_from={effective_from} "
              f"matched={report['matched_population']} "
              f"automatic={gate.automatic_checks_passed} "
              f"remaining_failures={failures}"
          )
          if not gate.automatic_checks_passed:
              raise SystemExit(
                  "Checks automáticos continuam bloqueados após "
                  "enriquecimento populacional."
              )
          PY

      - name: Validate historical revisions
        run: |
          python -m src.cli validate-history-revisions "$COMPETENCE" \
            --baseline /tmp/published-history.json \
            --package-root data/revisions \
            --strict

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: caged-${{ steps.target.outputs.competence }}-audit
          retention-days: 3
          if-no-files-found: error
          path: |
            data/gold/*${{ steps.target.outputs.competence }}*.json
            data/gold/rehydration-${{ steps.target.outputs.competence }}.json
            data/gold/market-${{ steps.target.outputs.competence }}.parquet
            data/gold/trend.json
            data/bronze/${{ steps.target.outputs.competence }}/archives/download-manifest.json
            data/bronze/${{ steps.target.outputs.competence }}/extracted/*.manifest.json
            data/reference/ipca.json
            data/reference/municipalities.json
            data/reference/population.json
            data/revisions/${{ steps.target.outputs.competence }}/**
